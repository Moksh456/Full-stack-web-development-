<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Call Reminder</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main>

        <div class="container">

            <!-- Header -->
            <div class="header">
                <h1>Call Reminder</h1>
                <p>Keep track of important calls and contacts</p>
            </div>


            <!-- Main Content -->
            <div class="content-wrapper">


                <!-- Navigation -->
                <div class="nav-controls">

                    <button class="nav-btn add-btn" title="Add Contact">
                        +
                    </button>

                    <button class="nav-btn up-btn" title="Previous">
                        ↑
                    </button>

                    <button class="nav-btn down-btn" title="Next">
                        ↓
                    </button>

                </div>


                <!-- Cards -->
                <div class="card-stack"></div>


                <!-- Add Contact Form -->
                <div class="inputs hide">

                    <form>

                        <input
                            type="text"
                            class="input-field name"
                            placeholder="Enter Name"
                            required
                        >

                        <input
                            type="text"
                            class="input-field purpose"
                            placeholder="Enter Purpose"
                            required
                        >

                        <input
                            type="text"
                            class="input-field position"
                            placeholder="Enter Position"
                            required
                        >

                        <input
                            type="url"
                            class="input-field image-url"
                            placeholder="Enter Image URL"
                            required
                        >

                        <button
                            class="btn btn-add"
                            type="submit"
                        >
                            Add Contact
                        </button>

                    </form>

                </div>


                <!-- Themes -->
                <div class="theme-selector">

                    <button
                        class="theme-btn theme-blue"
                        title="Blue Theme">
                    </button>

                    <button
                        class="theme-btn theme-green"
                        title="Green Theme">
                    </button>

                    <button
                        class="theme-btn theme-red"
                        title="Red Theme">
                    </button>

                    <button
                        class="theme-btn theme-black"
                        title="Dark Theme">
                    </button>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
